/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const role = () => state.user ? state.user.role : '';
const isAdmin = () => role() === 'admin';
const isTeacher = () => role() === 'teacher';
const lastName = n => String(n).trim().split(/\s+/).pop().toLowerCase();
const initials = n => { const p = String(n).trim().split(/\s+/); return ((p[0]||'')[0] || '') + ((p.length > 1 ? p[p.length-1] : '')[0] || ''); };
const palette = n => PALETTE[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % PALETTE.length];
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? `${+m[2]}/${+m[3]}/${m[1]}` : ''; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const timeStr = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
const groupLabel = g => `${TYPE_LABEL[g.type] || g.type} · ${g.name}`;
const sortStudents = list => list.slice().sort((a, b) => lastName(a.name).localeCompare(lastName(b.name)) || a.name.localeCompare(b.name));
const groupById = id => (state.data.groups || []).find(g => g.id === id);
const teacherById = id => (state.data.teachers || []).find(t => t.id === id);
const student = () => state.data && state.data.students.find(s => s.id === state.selectedId);
const schedById = id => (state.data.schedules || []).find(x => x.id === id);
const hm = t => { const m = /^(\d\d):(\d\d)$/.exec(t || ''); return m ? ((+m[1] % 12) || 12) + ':' + m[2] : ''; };
const rangeStr = (a, b) => (a && b) ? hm(a) + '–' + hm(b) : '';
const daysStr = d => (d || []).length === 5 ? 'Daily' : (d || []).map(x => DAY_LABEL[x]).join(', ');
const minsBetween = (a, b) => (+b.slice(0,2) * 60 + +b.slice(3)) - (+a.slice(0,2) * 60 + +a.slice(3));
const overlaps = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;
const groupWhen = g => (g.days && g.days.length && g.start && g.end) ? daysStr(g.days) + ' · ' + rangeStr(g.start, g.end) : (g.timeBlock || '');
const weekMins = g => (g.days && g.start && g.end && g.end > g.start) ? g.days.length * minsBetween(g.start, g.end) : 0;
const canEditSession = x => isAdmin() || (role() === 'interventionist' && x.loggedById === state.user.id);
const canLog = () => (state.data.groups || []).some(g => g.mine);
const typeChip = g => `<span class="chip ${g.type === 'dyslexia' ? 'dys' : 'grp'}">${esc(TYPE_LABEL[g.type])}</span>`;
function groupMembers(g) {
  if (g.members) return sortStudents(g.members);
  return sortStudents(state.data.students.filter(s => (s.groupIds || []).includes(g.id)).map(s => ({ id: s.id, name: s.name, grade: s.grade })));
}
/* Where a group's time lands on a student's day: fixed blocks (specials, PE, lunch, recess, chapel) and the student's other groups. */
function groupConflicts(s, g) {
  if (!g.start || !g.end || !(g.days || []).length) return [];
  const sc = schedById(s.scheduleId); const hits = {};
  const add = (label, d) => { (hits[label] = hits[label] || []).push(DAY_LABEL[d]); };
  (g.days || []).forEach(d => {
    if (sc) sc.blocks.forEach(b => { if (b.kind === 'fixed' && b.days.includes(d) && overlaps(g.start, g.end, b.start, b.end)) add(b.name, d); });
    (s.groupIds || []).filter(id => id !== g.id).map(groupById).filter(o => o && o.start && o.end && (o.days || []).includes(d)).forEach(o => { if (overlaps(g.start, g.end, o.start, o.end)) add(groupLabel(o), d); });
  });
  return Object.keys(hits).map(k => k + ' (' + hits[k].join(', ') + ')');
}

function tierSummary(s) {
  const parts = [s.grade];
  if (s.tier === 'none' && s.dyslexia && !s.speech && !s.build) parts.push('MTA only');
  else {
    parts.push(TIER_LABEL[s.tier]);
    if (s.dyslexia) parts.push('MTA');
    if (s.speech) parts.push('Speech');
    if (s.speechDismissed) parts.push('Speech (dismissed)');
    if (s.build) parts.push('BUILD');
  }
  return parts.join(' · ');
}
function reevalStatus(s) {
  const d = s && s.keyDates && s.keyDates.nextReeval;
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
  const t = today();
  if (d < t) return 'past';
  const days = Math.round((new Date(d + 'T00:00:00') - new Date(t + 'T00:00:00')) / 86400000);
  return days <= 60 ? 'soon' : '';
}
function flagChips(s) {
  let h = '';
  const rs = reevalStatus(s);
  if (rs === 'past') h += '<span class="chip duePast">Re-eval past due</span>';
  else if (rs === 'soon') h += '<span class="chip dueSoon">Re-eval due soon</span>';
  if (s.tier !== 'none') h += `<span class="chip ${TIER_CLASS[s.tier]}">${TIER_LABEL[s.tier]}</span>`;
  if (s.dyslexia) h += '<span class="chip dys" title="Receives MTA (dyslexia) services">MTA</span>';
  if (s.speech) h += '<span class="chip sp">Speech</span>';
  if (s.speechDismissed) h += `<span class="chip" style="background:#E6E8EB;color:#4A5560" title="${esc(s.speechNote || 'Was in speech; dismissed')}">Speech (dismissed)</span>${s.speechNote ? `<span class="small" style="font-size:12px;color:#4A5560;align-self:center">${esc(s.speechNote)}</span>` : ''}`;
  if (s.build) h += '<span class="chip sp">BUILD</span>';
  if (s.dnq) h += '<span class="chip" style="background:#E9E2F4;color:#4A2E80" title="Evaluated, did not qualify">DNQ</span>';
  if (s.followUp) h += `<span class="chip" style="background:#FBEBD0;color:#8A5A00" title="${esc(s.followUp)}">Follow up</span>`;
  if (s.tier === 'none' && !s.dyslexia && !s.speech && !s.build) h += '<span class="chip none">No tier</span>';
  return h;
}
function seenBy(s) {
  // Same rule the server uses to decide which interventionist sees a student.
  const dysGroup = (s.groupIds || []).some(id => { const g = groupById(id); return g && g.type === 'dyslexia'; });
  return (state.data.staff || []).filter(p => p.scope === 'all' || (p.scope === 'dyslexia' ? (s.dyslexia || dysGroup) : s.tier !== 'none'))
    .map(p => lastName(p.name).replace(/^./, c => c.toUpperCase())).join(', ');
}

/* ---------- API ---------- */
async function api(action, payload) {
  const body = Object.assign({ action, token: state.token }, payload || {});
  if (DEMO) return demoApi(action, body);
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
    return await res.json();
  } catch (e) {
    return { error: 'Could not reach the server. Check your connection and try again.' };
  }
}
function handleAuthError(r) {
  if (r && r.error === 'auth') { signOutLocal('Your session expired. Please sign in again.'); return true; }
  return false;
}

/* ---------- session ---------- */
function saveSession() { try { sessionStorage.setItem('elem_session', JSON.stringify({ token: state.token, user: state.user })); } catch (e) {} }
function signOutLocal(msg) {
  state.token = null; state.user = null; state.data = null; state.selectedId = null; state.docs = null; state.view = 'home'; if (state.hub) { clearInterval(state.hub.poll); state.hub.tests = null; state.hub.builder = state.hub.results = state.hub.finish = null; }
  state.loginMsg = msg || '';
  try { sessionStorage.removeItem('elem_session'); } catch (e) {}
  closeModal(); render();
}
async function signOut() { const t = state.token; if (t) await api('logout'); signOutLocal(''); }
let idleTimer = null;
function bumpIdle() { clearTimeout(idleTimer); if (state.token) idleTimer = setTimeout(() => signOutLocal('You were signed out after 30 minutes of inactivity.'), IDLE_MS); }
['click','keydown'].forEach(ev => document.addEventListener(ev, bumpIdle, true));

async function doLogin() {
  const input = $('codeInput'); const code = input.value.trim();
  if (!code) { state.loginMsg = 'Enter your access code.'; render(); return; }
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Signing in...';
  const r = await api('login', { code });
  if (r.error) { state.loginMsg = r.message || (r.error === 'Invalid code' ? 'That code did not work.' : r.error); render(); return; }
  state.token = r.token; state.user = r.user; state.loginMsg = ''; state.view = 'home'; state.selectedId = null;
  saveSession();
  await loadAll(true);
}
async function loadAll(showErr) {
  const r = await api('getAll');
  if (handleAuthError(r)) return;
  if (r.error) { state.notice = { type:'err', text: r.error }; render(); return; }
  state.data = r; state.user = r.user; state.syncedAt = new Date();
  if (state.selectedId && !state.data.students.some(s => s.id === state.selectedId)) state.selectedId = null;
  bumpIdle(); render();
}

}

function bodyHtml() {
  const v = state.view;
  const notice = state.notice ? `<div class="banner ${state.notice.type}" role="status">${esc(state.notice.text)}</div>` : '';
  if (v === 'home') return `<div class="body">${sideHtml()}<section class="main">${notice}${student() ? profileHtml(student()) : emptyHtml()}</section></div>`;
  let inner;
  if ((v === 'reports' && isTeacher()) || (v === 'grades' && !isAdmin())) inner = emptyHtml();
  else if (v === 'reports') inner = reportsHtml();
  else if (v === 'grades') inner = gradesHtml();
  else if (v === 'overview') inner = overviewHtml();
  else if (v === 'testing-calendar') inner = calendarHtml();
  else if (v === 'testing-summary') inner = summaryHtml();
  else if (v === 'hub') inner = (isTeacher() || isAdmin()) ? hubHtml() : emptyHtml();
  else if (v === 'access') inner = accessHtml();
  else if (v === 'logins') inner = loginsHtml();

/** One line chart for one scale (NWEA reading and math share a scale; DRA, BUILD and Take Flight each have their own). */
function trendSvg(entries, measures) {
  const pts = entries.filter(x => x.value != null && measures.includes(x.measure)).sort((a, b) => a.date.localeCompare(b.date));
  if (!pts.length) return '';
  const W = 640, H = 230, L = 46, R = 18, T = 16, B = 38;
  let lo = Math.min(...pts.map(p => p.value)), hi = Math.max(...pts.map(p => p.value));
  if (hi - lo < 4) { lo -= 2; hi += 2; } else { const pad = (hi - lo) * 0.12; lo -= pad; hi += pad; }
  const t0 = Math.min(...pts.map(p => dayMs(p.date))), t1 = Math.max(...pts.map(p => dayMs(p.date)));
  const X = d => L + (t1 === t0 ? (W - L - R) / 2 : (dayMs(d) - t0) / (t1 - t0) * (W - L - R));
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const grid = [0, 1, 2, 3].map(i => { const v = lo + (hi - lo) * i / 3; return `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W - R}" y2="${Y(v).toFixed(1)}" stroke="#E3E8EE"/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#5A6B7B">${Math.round(v)}</text>`; }).join('');
  const series = measures.map(m => ({ m, p: pts.filter(x => x.measure === m) })).filter(s => s.p.length);
  const lines = series.map(s => `<polyline fill="none" stroke="${MEASURE_COLOR[s.m]}" stroke-width="3" stroke-linejoin="round" points="${s.p.map(p => X(p.date).toFixed(1) + ',' + Y(p.value).toFixed(1)).join(' ')}"/>` +
    s.p.map(p => `<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="5" fill="${MEASURE_COLOR[s.m]}"><title>${esc(p.measure + ' ' + p.score + ' on ' + fmtDate(p.date))}</title></circle>`).join('')).join('');
  const dates = [...new Set(pts.map(p => p.date))]; const step = Math.max(1, Math.ceil(dates.length / 6));
  const xl = dates.filter((d, i) => i % step === 0 || i === dates.length - 1).map(d => `<text x="${X(d).toFixed(1)}" y="${H - 14}" text-anchor="middle" font-size="11" fill="#5A6B7B">${esc(shortDate(d))}</text>`).join('');
  const desc = series.map(s => s.m + ': ' + s.p.map(p => p.score + ' on ' + fmtDate(p.date)).join(', ')).join('; ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="${esc('Trend. ' + desc)}">${grid}${lines}${xl}</svg>` +
    `<div style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px;margin-top:6px">${series.map(s => `<span><b style="color:${MEASURE_COLOR[s.m]}">&#9632;</b> ${esc(s.m)}</span>`).join('')}</div>`;
}

function latestByMeasure(list) {
  const out = {};
  list.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || '')).forEach(x => { if (!out[x.measure]) out[x.measure] = x; else if (!out[x.measure].prev) out[x.measure].prev = x; });
  return out;
}
/** Compare the newest grade report with the one before it. */
function gradeTrend(g) {
  if (g.length < 2) return null;
  const cur = g[0], prev = g[1];
  if (cur.kind === 'number') {
    const delta = (cur.average != null && prev.average != null) ? Math.round((cur.average - prev.average) * 10) / 10 : null;
    let worst = null;
    Object.keys(cur.values).forEach(k => { if (prev.values[k] != null) { const d = Math.round((cur.values[k] - prev.values[k]) * 10) / 10; if (!worst || d < worst.d) worst = { subject: k, d }; } });
    return { kind: 'number', delta, worst, watch: delta != null && delta <= -WATCH_DROP, prev };
  }
  const down = Object.keys(cur.values).filter(k => prev.values[k] && LABEL_RANK[cur.values[k]] < LABEL_RANK[prev.values[k]]);
  const ni = Object.keys(cur.values).filter(k => cur.values[k] === 'Needs Improvement');
  return { kind: 'label', down, ni, watch: down.length > 0 || ni.length > 0, prev };
}

function parseDelimited(text) {
  text = String(text || '').replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = first.indexOf('\t') >= 0 ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ''));
}
/** "Last, First Middle" and "First Middle Last" both become "first last". */
function nameKey(raw) {
  const t = String(raw || '').replace(/\s+/g, ' ').trim(); if (!t) return '';
  let first, last;
  if (t.indexOf(',') >= 0) { const p = t.split(','); last = p[0].trim().split(' ').pop(); first = (p[1] || '').trim().split(' ')[0]; }
  else { const p = t.split(' '); first = p[0]; last = p[p.length - 1]; }
  return ((first || '') + ' ' + (last || '')).toLowerCase().replace(/[^a-z ]/g, '').trim();
}
function defaultMonth() { const d = new Date(); if (d.getDate() <= 14) d.setMonth(d.getMonth() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
function monthOptions(cur) {
  const out = []; const d = new Date(); d.setDate(1);
  for (let i = 0; i < 14; i++) { const v = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; out.push(`<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(monthLabel(v))}</option>`); d.setMonth(d.getMonth() - 1); }
  return out.join('');
}
function startUpload(text) {
  const rows = parseDelimited(text);
  if (rows.length < 2) { state.notice = { type: 'err', text: 'I could not find a header row and student rows. Check the file and try again.' }; state.gu = null; render(); return; }
  const headers = rows[0];
  const find = re => headers.findIndex(h => re.test(h));
  let nameCol = headers.findIndex(h => /name|student/i.test(h) && !/teacher|parent|guardian|homeroom/i.test(h));
  const firstCol = find(/^first/i), lastCol = find(/^last/i);
  if (firstCol >= 0 && lastCol >= 0) nameCol = -1;
  if (nameCol === -2 || (nameCol < 0 && !(firstCol >= 0 && lastCol >= 0))) nameCol = 0;
  const skip = /^(id|student ?id)$|teacher|homeroom|grade ?level|^grade$|^gr$|campus|section|parent|guardian|^name$|student name/i;
  const subj = headers.map((h, i) => i).filter(i => i !== nameCol && i !== firstCol && i !== lastCol && headers[i] && !skip.test(headers[i]));
  state.gu = { month: state.guMonth || defaultMonth(), headers, rows: rows.slice(1), nameCol, firstCol, lastCol, subj, picks: {} };
  render();
}

function gradeCell(stu, raw) {

}

function reportData(key) {
  const R = recs(); const list = sortStudents(state.data.students); const rp = state.rp || {};
  if (key === 'service') {
    const per = {}; list.forEach(s => { per[s.id] = { n: 0, pres: 0, abs: 0, mins: 0 }; });
    (state.data.sessions || []).forEach(x => (x.attendance || []).forEach(a => { const p = per[a.studentId]; if (!p) return; p.n++; if (a.status === 'Present' || a.status === 'Left early') { p.pres++; p.mins += x.minutes; } else p.abs++; }));
    return { title: 'Service minutes (this school year)', head: ['Student', 'Grade', 'Sessions', 'Attended', 'Missed', 'Minutes delivered', 'Attendance'],
      rows: list.filter(s => per[s.id].n).map(s => { const p = per[s.id]; return [s.name, s.grade, p.n, p.pres, p.abs, p.mins, Math.round(p.pres / p.n * 100) + '%']; }) };
  }
  if (key === 'progress') {
    const cols = PROGRESS_MEASURES.filter(m => m !== 'Other');
    return { title: 'Latest progress by student', head: ['Student', 'Grade', ...cols],
      rows: list.map(s => { const lat = latestByMeasure(R.progress.filter(x => x.studentId === s.id));
        return [s.name, s.grade, ...cols.map(m => { const x = lat[m]; if (!x) return ''; let ch = ''; if (x.prev && x.value != null && x.prev.value != null) { const d = Math.round((x.value - x.prev.value) * 10) / 10; ch = ' (' + (d > 0 ? '+' : '') + d + ')'; } return x.score + ch + ' · ' + shortDate(x.date); })]; }).filter(r => r.slice(2).some(Boolean)) };
  }
  if (key === 'gradewatch') {
    const rows = [];
    list.forEach(s => { const g = R.grades.filter(x => x.studentId === s.id).sort((a, b) => b.month.localeCompare(a.month)); const t = gradeTrend(g);
      if (!t || !t.watch) return;
      rows.push([s.name, s.grade, monthLabel(g[0].month), t.kind === 'number' ? 'Average ' + g[0].average + ' (' + t.delta + ' since ' + monthLabel(t.prev.month) + ')' + (t.worst && t.worst.d < 0 ? '; ' + t.worst.subject + ' ' + t.worst.d : '') : [t.down.length ? 'Moved down: ' + t.down.join(', ') : '', t.ni.length ? 'Needs Improvement: ' + t.ni.join(', ') : ''].filter(Boolean).join('; ')]); });
    return { title: 'Grade watch list (average down ' + WATCH_DROP + '+ points, or a K3 to K5 label moved down or at Needs Improvement)', head: ['Student', 'Grade', 'Latest report', 'What changed'], rows };
  }
  if (key === 'meetings') {
    const from = rp.from || schoolStart(), to = rp.to || today(), type = rp.type || '';
    return { title: 'Meeting log', head: ['Date', 'Student', 'Grade', 'Type', 'Who', 'Entered by', 'Notes'],
      rows: R.notes.filter(x => x.date >= from && x.date <= to && (!type || x.type === type)).sort((a, b) => b.date.localeCompare(a.date)).map(x => { const s = state.data.students.find(y => y.id === x.studentId) || {}; return [fmtDate(x.date), x.studentName || s.name || '', s.grade || '', x.type, x.who || '', x.byName || '', x.text]; }), filters: true, from, to, type };
  }
  // missing data
  const cut = new Date(); cut.setDate(cut.getDate() - 90); const cutS = `${cut.getFullYear()}-${String(cut.getMonth() + 1).padStart(2, '0')}-${String(cut.getDate()).padStart(2, '0')}`;
  const months = [...new Set(R.grades.map(g => g.month))].sort(); const latest = months[months.length - 1];
  const rows = [];
  list.forEach(s => { const miss = [];
    if (!R.progress.some(x => x.studentId === s.id && x.date >= cutS)) miss.push('No progress entry in 90 days');
    if (latest && !(s.grade === '1st' && +latest.slice(5) >= 7) && !R.grades.some(g => g.studentId === s.id && g.month === latest)) miss.push('No ' + monthLabel(latest) + ' grades');
    if (miss.length) rows.push([s.name, s.grade, miss.join('; ')]); });
  return { title: 'Missing data', head: ['Student', 'Grade', 'Missing'], rows };
}

function clockText(t) {
  const m = /^(\d{1,2}):(\d{2})\s*([ap]m?)?$/i.exec(String(t).trim()); if (!m) return '';

}

    const p = line.split('|').map(x => x.trim());
    let days, time, name, kind;
    if (p.length >= 3) { days = p[0]; time = p[1]; name = p[2]; kind = p[3]; } else if (p.length === 2) { days = ''; time = p[0]; name = p[1]; } else { bad.push(line); return; }

    const t = time.split(/\s*[-–]\s*/); const a = clockText(t[0] || ''), b = clockText(t[1] || '');

}

const WHERE_LABEL = { hub:'In class', wendy:'With Mrs. Blasingame', abby:'With Mrs. Danielson', tbd:'Place not set' };

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const tests = () => recs().tests || [];
const windows = () => recs().windows || [];
const isApprover = () => isAdmin() || !!(state.user && state.user.canApprove);

const tClock = t => t.allDay ? 'All day' : hm(t.start);

const isoOf = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); };

const dayKeyOf = d => ({ 1:'M', 2:'T', 3:'W', 4:'R', 5:'F' })[dowOf(d)] || '';

function conflictsFor(date, start, end, stu, excludeId) {

  const full = studentById(stu.id);
  ((full && full.groupIds) || []).map(groupById).filter(g => g && g.start && g.end && g.type !== 'push-in' && (g.days || []).includes(dk) && overlaps(start, end, g.start, g.end)).forEach(g => out.push(groupLabel(g) + ' ' + rangeStr(g.start, g.end)));
  tests().filter(x => x.id !== excludeId && x.date === date && x.status !== 'declined' && (x.studentIds || []).includes(stu.id) && overlaps(start, end, x.start, x.end)).forEach(x => out.push('Another test: ' + x.title + ' ' + rangeStr(x.start, x.end)));

function winTags(d) { return calWindows().filter(w => w.start <= d && d <= w.end).map(w => `<span class="chip wtag">${esc(w.measure)}</span>`).join(''); }
function monthGrid(c) {
  const first = c.date.slice(0, 7) + '-01'; const list = calTests();
  let d = weekStartOf(first); const cells = []; const ym = c.date.slice(0, 7);
  const lastMs = Date.UTC(+c.date.slice(0, 4), +c.date.slice(5, 7), 0);
  while (dayMs(d) <= lastMs) {
    for (let i = 0; i < 5; i++) {
      const day = addDays(d, i); const ev = list.filter(t => t.date === day); const off = day.slice(0, 7) !== ym;
      cells.push(`<div class="${off ? 'off' : ''} ${day === today() ? 'tod' : ''}"><div class="cd"><button class="link" style="min-height:24px;padding:0" data-act="goDay" data-d="${day}">${esc(dayLabel(day))}</button>${winTags(day)}</div>${ev.slice(0, 3).map(evBtn).join('')}${ev.length > 3 ? `<button class="link" data-act="goDay" data-d="${day}">+${ev.length - 3} more</button>` : ''}</div>`);
    }

}

/* ----- testing prep summary ----- */
function prepRange() {
  const r = (state.ts && state.ts.range) || 'week'; const t = today(); const ws = weekStartOf(t);
  if (r === 'next') return [addDays(ws, 7), addDays(ws, 11), 'Next week'];
  if (r === 'month') { const y = +t.slice(0, 4), m = +t.slice(5, 7); return [t.slice(0, 7) + '-01', isoOf(Date.UTC(y, m, 0)), MONTH_LONG[m - 1]]; }
  return [ws, addDays(ws, 4), 'This week'];
}
function prepData() {
  const [a, b] = prepRange(); const inR = tests().filter(t => t.date >= a && t.date <= b && t.status !== 'declined');
  const ok = inR.filter(t => t.status === 'approved');

/* ---------- Phase 5: reading a teacher's test document (.docx) ---------- */
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const IMG_MIME = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp' };
async function zipOpen(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let e = u8.length - 22;

  const entries = {};

    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    entries[name] = { method, data: u8.subarray(start, start + csize) };
    p += 46 + nl + el + cl;

    has: name => !!entries[name], names: () => Object.keys(entries),
    async get(name) {

}
const kids = (node, name) => [...node.childNodes].filter(c => c.nodeType === 1 && c.localName === name);
const kid = (node, name) => kids(node, name)[0] || null;
const wval = (node, name) => { const k = node && kid(node, name); return k ? (k.getAttributeNS(W_NS, 'val') || k.getAttribute('w:val') || '') : ''; };

/** Reads a .docx and returns ordered blocks: paragraphs (text, images) and tables. `shrink(bytes, mime)` returns a data URI. */
async function docxBlocks(buf, shrink) {

        const ln = c.localName;
        if (ln === 'r') {

            else if (x.localName === 'pict' || x.localName === 'object') { const im = descendants(x, 'imagedata')[0]; if (im) { const u = await imageFor(attrAny(im, 'id')); if (u) images.push(u); } }
          }

/** Turns document blocks into questions, with shared reading passages and pictures. Teachers check and fix the result in the builder. */
function parseTestBlocks(blocks) {

    finish();

  }
  function addImage(u) {
    imgsUsed++;

    if (passageOpen && curP && !curP.image && !cur) { curP.image = u; return; }
    const p = startPassage(''); p.image = u;
  }
  const lines = [];
  blocks.forEach((b, i) => {
    if (b.kind === 'p') { lines.push(b); return; }
    const rows = b.rows.filter(r => r.some(c => c.trim()));
    const two = rows.length && rows.every(r => r.filter(c => c.trim()).length === 2 && r.length === 2);
    if (two && (inMatch || (cur && /\bmatch/i.test(cur.text)))) { lines.push({ kind: 'matchtable', rows }); return; }
    rows.forEach(r => r.forEach(c => c.split('\n').forEach(t => { if (t.trim()) lines.push({ kind: 'p', text: t.trim(), images: [] }); })));
    b.images.forEach(u => lines.push({ kind: 'p', text: '', images: [u] }));

    if (b.kind === 'matchtable') {
      if (!cur) cur = newQ('Match each item.'); cur.left = b.rows.map(r => r[0].replace(/^\d+[.)]\s*/, '').trim()); cur.bank = b.rows.map(r => r[1].replace(/^[A-Ha-h][.)]\s*/, '').trim()); finish(); continue;
    }

    if (text && /^(name|date|class|teacher|period)\b[^a-z]{0,3}(:|_)/i.test(text) && text.length < 90) continue;
    const cm = /^\(?([A-Ha-h])[.)]\s+(\S.*)$/.exec(text), qm = /^(\d{1,3})\s*[.)]\s*(.*)$/.exec(text);

      parts.forEach(pt => { const m = /^\(?[A-Ha-h][.)]\s+(.*)$/.exec(pt.trim()); if (m) (inMatch ? cur.bank : cur.choices).push(m[1].trim()); });
    } else if (qm && !(inMatch && cur && cur.bank.length === 0 && false)) {
      if (inMatch && cur && !cur.bank.length) cur.left.push(qm[2].trim());
      else {
        finish(); cur = newQ(qm[2].trim());
        inMatch = /^match(ing)?\b|\bmatch\b.*\b(with|to)\b/i.test(cur.text);
        if (cur.passageId === '' && curP && passageOpen) cur.passageId = curP.id;

      }
    } else if (text) {
      const cue = /^(read|use|look at|study|passage|story|text|poem|article)\b/i.test(text) && text.length > 25;
      if (cur && !(cur.choices && cur.choices.length) && !(inMatch && cur.bank.length) && text.length <= 220 && !cue) cur.text += (cur.text ? '\n' : '') + text;
      else if (text.length > 120 || cue) {
        let title = '';

  questions.forEach(q => { if (q.type === 'heading') return; if (!q.passageId) q.passageId = ''; });

  if (!real.length) warnings.push('No numbered questions were found. You can add them yourself below.');
  const mcN = real.filter(q => q.type === 'mc').length;
  if (mcN) warnings.push('Choose the right answer on each multiple choice question if you want matches marked. This is optional.');
  return { passages, questions, warnings, found: { questions: real.length, pictures: imgsUsed, passages: passages.length } };
}

/** Spelling lists: one word per line, optional sentence after a dash. */
function parseSpellingText(text) {
  return String(text || '').split(/\r?\n/).map(l => l.replace(/^\s*(\d+[.)]|[-•*])\s*/, '').trim()).filter(Boolean).map(l => {
    const m = /^(\S[^\-–—:|]*?)\s*(?:[-–—:|])\s*(.+)$/.exec(l);
    return m ? { word: m[1].trim(), sentence: m[2].trim() } : { word: l, sentence: '' };
  });
}

async function shrinkImage(bytes, mime) {
  const blob = new Blob([bytes], { type: mime });

/* ---------- PDF tests: text by line, pictures cropped from the page where they sit ---------- */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js'; s.onload = res; s.onerror = () => rej(new Error('Could not load the PDF reader. Check the connection.')); document.head.appendChild(s); });

  return window.pdfjsLib;
}
async function pdfBlocks(buf) {

  const blocks = [], warnings = []; let textChars = 0;
  for (let pn = 1; pn <= pdf.numPages; pn++) {
    const page = await pdf.getPage(pn), tc = await page.getTextContent(), items = [];
    // text lines, top to bottom
    const lines = [];
    tc.items.forEach(it => { if (!it.str || !it.str.trim()) return; const y = it.transform[5], h = it.height || 10;
      let ln = lines.find(l => Math.abs(l.y - y) < Math.max(2, h * 0.4)); if (!ln) { ln = { y, h, parts: [] }; lines.push(ln); } ln.parts.push({ x: it.transform[4], w: it.width, s: it.str }); });
    lines.forEach(l => { l.parts.sort((a, b) => a.x - b.x); let t = '', end = null; l.parts.forEach(p => { if (end !== null && p.x - end > 1.5) t += ' '; t += p.s; end = p.x + p.w; }); l.text = t.replace(/\s+/g, ' ').trim(); textChars += l.text.length; items.push({ top: l.y + l.h, y: l.y, h: l.h, text: l.text }); });
    // pictures
    const ops = await page.getOperatorList(), OPS = lib.OPS, rects = [], stack = []; let ctm = [1, 0, 0, 1, 0, 0];
    const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
    ops.fnArray.forEach((fn, i) => {
      const a = ops.argsArray[i];
      if (fn === OPS.save) stack.push(ctm.slice()); else if (fn === OPS.restore) ctm = stack.pop() || ctm;
      else if (fn === OPS.transform) ctm = mul(ctm, a);
      else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject || fn === OPS.paintJpegXObject) {
        const x = Math.min(ctm[4], ctm[4] + ctm[0]), w = Math.abs(ctm[0]), y = Math.min(ctm[5], ctm[5] + ctm[3]), h = Math.abs(ctm[3]);
        if (w > 24 && h > 24) rects.push({ x, y, w, h });
      }
    });
    if (rects.length) {
      const vp = page.getViewport({ scale: 2 }), cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;

        const [x1, y1, x2, y2] = vp.convertToViewportRectangle([r.x, r.y, r.x + r.w, r.y + r.h]);
        const sx = Math.max(0, Math.min(x1, x2)), sy = Math.max(0, Math.min(y1, y2)), sw = Math.min(vp.width - sx, Math.abs(x2 - x1)), sh = Math.min(vp.height - sy, Math.abs(y2 - y1));

        const k = Math.min(1, 900 / sw), c2 = document.createElement('canvas'); c2.width = Math.round(sw * k); c2.height = Math.round(sh * k);
        const cx = c2.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c2.width, c2.height); cx.drawImage(cv, sx, sy, sw, sh, 0, 0, c2.width, c2.height);
        items.push({ top: r.y + r.h, y: r.y + r.h, image: canvasUri(c2, false) });

    }
    items.sort((a, b) => b.top - a.top);
    let prevY = null, prevH = 10;
    items.forEach(it => {
      if (it.image) { blocks.push({ kind: 'p', text: '', images: [it.image] }); prevY = null; return; }
      if (prevY !== null && prevY - it.y > prevH * 1.9) blocks.push({ kind: 'p', text: '', images: [] });

}

let S = null;
const stuStore = { get(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }, del(k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function stuVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    return vs.find(v => v.name === 'Chrome OS US English 4') || vs.find(v => /US English/i.test(v.name)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (e) { return null; }
}
function stuStopSpeech() { try { speechSynthesis.cancel(); } catch (e) {} }
function stuSay(parts) {
  stuStopSpeech();
  if (!window.speechSynthesis || !S) return;
  S.used.read = true; S.usedDirty = true;
  const v = stuVoice();
  (Array.isArray(parts) ? parts : [parts]).filter(Boolean).forEach(p => {
    const u = new SpeechSynthesisUtterance(String(p)); u.rate = 0.8; u.lang = 'en-US'; if (v) u.voice = v;
    speechSynthesis.speak(u);
  });
}
function stuBuildSteps(test) {
  if (test.kind === 'spelling') return (test.spelling || []).map((w, i) => ({ kind:'spell', key:'w' + i, word:w.word, sentence:w.sentence }));
  const steps = []; let heads = [];
  (test.questions || []).forEach(q => { if (q.type === 'heading') heads.push(q.text); else { steps.push({ kind:'q', key:q.id, q, heads }); heads = []; } });
  return steps;
}
const stuPassage = id => (S.test.passages || []).find(p => p.id === id);

/* ---------- starting ---------- */

  if (S.code) stuOpen(S.code, true); else stuRender();

}
async function stuOpen(code, quiet) {
  const r = await api('stuOpen', { code });
  if (!r || r.error) {
    stuStore.del('stu_code'); S.code = ''; S.page = 'code';
    S.msg = !r ? 'Could not connect.' : r.error === 'nocode' ? (quiet ? '' : 'That code did not work. Check with your teacher.') : (r.message || r.error);
    return stuRender();
  }

}
function stuPollStart() {
  clearInterval(S.poll);
  S.poll = setInterval(async () => {
    if (!S || S.preview || !['wait', 'names'].includes(S.page)) return;
    const r = await api('stuOpen', { code: S.code });
    if (!S || !['wait', 'names'].includes(S.page)) return;
    if (!r || r.error) { if (r && r.error === 'nocode') { stuStore.del('stu_code'); S.code = ''; S.page = 'code'; S.msg = 'This test is finished. Ask your teacher for the next code.'; stuRender(); } return; }
    const changed = r.waiting !== S.run.waiting || JSON.stringify(r.students) !== JSON.stringify(S.run.students);
    S.run = r; if (changed) { S.page = r.waiting ? 'wait' : 'names'; stuRender(); }
  }, 5000);
}

function stuReviewHtml() {

    <p class="st-sub">${miss.length ? 'You have not answered ' + miss.length + ' ' + (S.test.kind === 'spelling' ? 'word' : 'question') + (miss.length > 1 ? 's' : '') + ' yet.' : 'You answered everything.'}</p>
    ${miss.length ? `<div class="st-names">${miss.map(x => `<button class="st-name" data-act="stuGoto" data-i="${x.i}">${S.test.kind === 'spelling' ? 'Word' : 'Question'} ${x.i + 1}</button>`).join('')}</div>` : ''}
    ${S.err ? `<div class="st-err" role="alert">${esc(S.err)}</div>` : ''}
    <button class="st-btn" data-act="stuFinish">${miss.length ? 'Finish anyway' : 'Yes, I am finished'}</button><button class="st-btn no" data-act="stuBackToTest">Go back to the test</button></div>`);
}
function stuHasAnswer(st) {
  const v = S.answers[st.key]; if (v == null || v === '') return false;

function stuStepHtml() {
